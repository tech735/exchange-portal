# Security checks: secrets, code patterns, vulnerable dependencies, CodeQL.
# Actions are pinned to full commit SHAs (version in the comment); Dependabot keeps them current.
name: Security

on:
  pull_request:
  push:
    branches: [main, revamp] # revamp = pre-live branch, so checks run before going live
  schedule:
    - cron: '30 3 * * 1' # Mondays 09:00 IST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secrets (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, so old commits are scanned too
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # personal-account repo: no GITLEAKS_LICENSE needed

  semgrep:
    name: Code patterns (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Semgrep scan
        run: >
          pipx run semgrep==1.180.0 scan
          --config p/owasp-top-ten
          --config p/secrets
          --config p/typescript
          --config p/react
          --error --metrics=off

  dependencies:
    name: Dependencies (npm audit + OSV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Gate on what ships to users. Build-only tools (vite, tailwind, eslint...) are
      # still reported below but don't block: an advisory with no fixed release yet
      # (e.g. picomatch GHSA-fc5q-39xc-vjpf, Oct 2026) would otherwise keep CI red.
      - name: npm audit, shipped code (fails on high / critical)
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit, everything incl. build tools (report only)
        continue-on-error: true
        run: npm audit --audit-level=high
      - name: OSV-Scanner (report only; npm audit above is the gate)
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        continue-on-error: true
        with:
          scan-args: |-
            --lockfile=package-lock.json

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload results to the Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
